[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nyayalens-schemas"
version = "0.1.0"
description = "Shared domain schemas for NyayaLens"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["nyayalens_schemas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
